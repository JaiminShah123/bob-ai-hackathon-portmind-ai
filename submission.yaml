submission:
  title: "Container Congestion Predictor & Port Operations Optimiser"
  problem_statement: >
    Ports worldwide face severe container congestion due to unpredictable vessel arrivals,
    inefficient resource allocation, and lack of real-time visibility into container volumes.
    This causes delays of 3-5 days per vessel, increased demurrage costs, and cascading
    supply chain disruptions affecting importers, exporters, and logistics companies.
  solution_summary: >
    PortMind AI uses machine learning to predict container congestion levels at ports by
    analyzing historical vessel arrival patterns, container volumes, and port resource data.
    Our solution provides actionable insights through a dashboard that helps port authorities
    optimize berth allocation, crane scheduling, and yard planning before congestion occurs.
  key_features:
    - "Container congestion prediction using time-series ML models"
    - "Vessel arrival analysis and delay forecasting"
    - "Container volume prediction with 85%+ accuracy"
    - "Port resource optimization recommendations"
    - "Interactive dashboard for port operations teams"